<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusTask — Task Manager</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <span class="logo-icon">⚡</span>
                <h1>FocusTask</h1>
            </div>
            <p class="subtitle">Spring Boot REST API + MySQL + Vanilla JS</p>
        </header>

        <!-- Notification Banner -->
        <div id="alertBanner" class="alert hidden"></div>

        <!-- Add Task Form -->
        <section class="card form-card">
            <h2>Add New Task</h2>
            <form id="taskForm">
                <div class="form-group">
                    <label for="taskTitle">Task Title <span class="required">*</span></label>
                    <input type="text" id="taskTitle" placeholder="e.g. Master Spring Boot REST APIs" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="taskDescription">Description</label>
                    <textarea id="taskDescription" rows="2" placeholder="e.g. Complete Phase 13 frontend integration and verify CORS"></textarea>
                </div>
                <button type="submit" id="submitBtn" class="btn btn-primary">
                    <span id="btnText">Add Task</span>
                    <span id="btnSpinner" class="spinner hidden"></span>
                </button>
            </form>
        </section>

        <!-- Tasks Section -->
        <section class="card tasks-card">
            <div class="tasks-header">
                <h2>Your Tasks</h2>
                <div class="task-stats">
                    <span id="taskCountBadge" class="badge">0 tasks</span>
                </div>
            </div>

            <!-- Loading State -->
            <div id="loadingIndicator" class="loading-state hidden">
                <div class="spinner-large"></div>
                <p>Loading tasks from MySQL...</p>
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="empty-state hidden">
                <div class="empty-icon">📝</div>
                <h3>No tasks yet</h3>
                <p>Add a task using the form above to get started!</p>
            </div>

            <!-- Task List -->
            <ul id="taskList" class="task-list"></ul>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
